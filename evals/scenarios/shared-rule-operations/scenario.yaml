id: shared-rule-operations
description: A cancellation-only request changes one consumer of shared promotion policy.
prompt: |
  Change waitlist promotion after cancellation: when a confirmed attendee cancels, promote the first waiting attendee only if at least two places are free, rather than whenever one place is free. Count free places after releasing the cancelled attendee's place. This change is only for cancellation. Keep the existing promotion condition for registration and reservation expiration.

  No human is available to answer questions or approve anything during this run. Follow KFD: where KFD requires human approval or a human decision, stop at that point and report what is needed.
expect:
  files_changed: ['knowledge/waitlist/knowledge.yaml']
  files_unchanged: ['app/**']
  file_not_contains:
    knowledge/waitlist/knowledge.yaml:
      - 'After\s+registration,\s+cancellation,\s+or\s+reservation\s+expiration,\s+if\s+at\s+least\s+one\s+place\s+is\s+free'
  file_contains:
    knowledge/waitlist/knowledge.yaml: ['(two|2)\s+(free\s+)?places|at least (two|2)']
  lint_clean: true
  transcript_contains: ['Knowledge Review']
