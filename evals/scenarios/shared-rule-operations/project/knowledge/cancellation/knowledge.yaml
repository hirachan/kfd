id: cancellation
name: Cancellation
purpose:
  why: Release a confirmed place when its attendee cancels.
contract:
  rules:
    - id: release-and-promote
      rule: Remove the cancelling attendee from confirmed, then invoke shared promotion under waitlist/promotion-condition.
      uses: [waitlist/promotion-condition]
dependencies:
  reads:
    waitlist: [promotion-condition]
  writes:
    waitlist: [confirmed-attendees, waiting-attendees]
mapping:
  implementation:
    primary: [app/src/cancellation.py]
  tests: [app/tests/cancellation/]
