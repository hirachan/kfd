id: registration
name: Registration
purpose:
  why: Let a new attendee join the queue and claim an available place.
contract:
  rules:
    - id: queue-and-promote
      rule: Append the new attendee to the waitlist, then invoke shared promotion under waitlist/promotion-condition.
      uses: [waitlist/promotion-condition]
dependencies:
  reads:
    waitlist: [promotion-condition]
  writes:
    waitlist: [confirmed-attendees, waiting-attendees]
mapping:
  implementation:
    primary: [app/src/registration.py]
  tests: [app/tests/registration/]
