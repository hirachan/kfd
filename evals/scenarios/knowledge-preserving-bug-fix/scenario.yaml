id: knowledge-preserving-bug-fix
description: Mixed-owner order history violates the existing own-orders-only rule.
prompt: |
  Customers report that their order history shows other customers' orders. Fix this.

  No human is available to answer questions or approve anything during this run. Follow KFD: where KFD requires human approval or a human decision, stop at that point and report what is needed.
expect:
  files_changed: [app/src/**, app/tests/**]
  files_unchanged: [knowledge/**]
  lint_clean: true
  transcript_not_contains: ['Approve this product meaning']
  commands_succeed:
    - python3 -m unittest discover -s app/tests -t .
    - >-
      python3 -c 'from app.src.orders import orders_for_customer; orders = [{"id": "A-1", "customer_id": "alice", "created_at": 1}, {"id": "B-1", "customer_id": "bob", "created_at": 3}, {"id": "A-2", "customer_id": "alice", "created_at": 2}]; assert [order["id"] for order in orders_for_customer(orders, "alice")] == ["A-2", "A-1"]; assert [order["id"] for order in orders_for_customer(orders, "bob")] == ["B-1"]'
